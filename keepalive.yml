# Mantém o projeto Supabase ativo: o plano gratuito pausa após 7 dias sem uso.
# Onde colocar no repositório: .github/workflows/keepalive.yml
name: Supabase keepalive
on:
  schedule:
    - cron: '0 12 * * 1,4'   # segundas e quintas, 12h UTC (9h no horário de Brasília)
  workflow_dispatch:          # permite rodar manualmente pelo GitHub
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o projeto
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/grade_info?select=id&limit=1"
